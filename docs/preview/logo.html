<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>车机管家 · Logo 预览</title>
<style>
:root{--ink:#171d26;--blue:#2c9ff5;--green:#34c759;--muted:#647080}*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.sheet{max-width:1120px;margin:44px auto;padding:48px;background:#fff;border-radius:28px;box-shadow:0 20px 70px #1b30451a}.eyebrow{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:.08em}.identity{display:flex;align-items:center;gap:36px;margin:28px 0 52px}.mark{width:168px;height:168px;flex:none}.wordmark{font-size:54px;font-weight:730;letter-spacing:.04em;line-height:1.1}.tagline{font-size:18px;color:var(--muted);margin-top:12px}.tests{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border-radius:20px;padding:28px;min-height:240px}.panel h2{font-size:14px;font-weight:600;margin:0 0 26px}.panel.light{background:#eef3f8}.panel.dark{background:#171d26;color:#f8f9fc}.sizes{display:flex;align-items:end;gap:28px}.sizes div{text-align:center;color:var(--muted);font-size:12px}.sizes img{display:block;margin:0 auto 10px}.dark .sizes div{color:#bfc4cd}.sample{display:flex;align-items:center;gap:18px}.sample img{width:72px;height:72px}.sample b{display:block;font-size:20px}.sample span{display:block;margin-top:5px;color:#bfc4cd;font-size:13px}.note{font-size:13px;color:var(--muted);margin:32px 0 0;line-height:1.7}@media(max-width:760px){.sheet{margin:0;padding:24px;border-radius:0}.identity{gap:20px}.mark{width:96px;height:96px}.wordmark{font-size:32px}.tagline{font-size:14px}.tests{grid-template-columns:1fr}}
</style>
</head>
<body><main class="sheet"><div class="eyebrow">应用标识 · 设计预览</div><div class="identity"><img class="mark" src="../../assets/brand/headunit-manager-icon.svg" alt="车机管家 Logo"><div><div class="wordmark">车机管家</div><div class="tagline">车机设置，一目了然</div></div></div><div class="tests"><section class="panel light"><h2>图标缩放</h2><div class="sizes"><div><img src="../../assets/brand/headunit-manager-icon.svg" width="96" height="96" alt="">96 px</div><div><img src="../../assets/brand/headunit-manager-icon.svg" width="72" height="72" alt="">72 px</div><div><img src="../../assets/brand/headunit-manager-icon.svg" width="48" height="48" alt="">48 px</div></div></section><section class="panel dark"><h2>深色车机界面</h2><div class="sample"><img src="../../assets/brand/headunit-manager-icon.svg" alt=""><div><b>车机管家</b><span>应用、文件与自动化管理</span></div></div></section></div><p class="note">亮蓝色圆角底面与深色车机应用卡片形成清晰对比；白色仪表弧线对应车机，深蓝勾形对应已管理的状态。应用清单现在对所有密度使用单张 512 px 图标；另提供 2048×2048 透明 PNG：<a href="../../assets/brand/headunit-manager-icon-2048.png" download>下载超高清 Logo</a>。</p></main></body></html>
